<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Meditação 🌙</title>
<meta name="description" content="Suas meditações, num toque." />
<meta name="theme-color" content="#fff1e5" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="stylesheet" href="styles.css" />
<script>try{if(localStorage.getItem("med:theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
</head>
<body>
<div class="bg-glow"></div>

<header class="top">
  <div>
    <p class="eyebrow">Respire · Aquiete · Esteja</p>
    <h1>Meditações</h1>
    <p class="sub">Suas meditações, num toque.</p>
  </div>
  <div class="header-btns">
    <button id="btnTheme" class="icon-circle" title="Alternar claro/escuro">☾</button>
  </div>
</header>

<main>
  <div class="chips-row">
    <span id="count" class="count"></span>
  </div>

  <section id="featured" class="featured hidden"></section>

  <p id="missingHint" class="hint hidden"></p>

  <section id="list" class="list"></section>

  <section class="how">
    <h2>Como adicionar novos áudios</h2>
    <p>Novos áudios entram pelo GitHub: o arquivo vai para <code>docs/audio/</code> e ganha 1 linha em <code>docs/meditations.json</code>. Pronto — aparece para todo mundo.</p>
  </section>
</main>

<!-- Mini player -->
<div id="mini" class="mini hidden">
  <div id="miniCover" class="cover xs g0">☾</div>
  <div class="mini-info" id="miniOpen">
    <strong id="miniTitle">—</strong>
    <div class="track"><div id="miniProg" class="fill"></div></div>
  </div>
  <button id="miniToggle" class="play-fab sm">▶</button>
</div>

<!-- Player expandido -->
<div id="sheet" class="sheet hidden">
  <div class="sheet-card">
    <button id="sheetClose" class="close">﹀</button>
    <div id="bigCover" class="cover xl g0">☾</div>
    <h2 id="pTitle">—</h2>
    <input id="seek" type="range" min="0" max="1000" value="0" />
    <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    <div class="controls">
      <button id="btnPrev" title="Anterior">⏮</button>
      <button id="btnBack" title="-10s">↺<small>10</small></button>
      <button id="btnToggle" class="play-fab">▶</button>
      <button id="btnFwd" title="+10s">↻<small>10</small></button>
      <button id="btnNext" title="Próxima">⏭</button>
    </div>
    <div class="row">
      <div class="speeds" id="speeds"></div>
    </div>
    <div class="row gap">
      <button id="btnTimer" class="ghost">⏱ Timer</button>
    </div>
    <div id="timerOpts" class="row gap hidden"></div>
    <p id="sleepLabel" class="sleep hidden"></p>
    <p id="pDesc" class="desc"></p>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
}
</script>
</body>
</html>
